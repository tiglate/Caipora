name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 26 (same distribution as .sdkmanrc)
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '26'
          cache: maven

      - name: Run tests
        # Tests use an in-memory H2 database (profile "test"): no PostgreSQL or .env needed.
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
