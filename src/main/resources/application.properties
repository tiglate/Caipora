# Optional .env file in the working directory (local development). Real environment variables take precedence,
# so in containers the variables can be defined externally and no .env file is needed.
spring.config.import=optional:file:.env[.properties]

# Data Source
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.types.print.banner=false
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=id_revision
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=id_revision_type

# Actuators
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Error Handling
error.handling.http-status-in-json-response=true
error.handling.exception-logging=NO_LOGGING
error.handling.full-stacktrace-http-statuses=5xx
error.handling.log-levels.5xx=ERROR
error.handling.http-statuses.org.springframework.security.authorization.AuthorizationDeniedException=unauthorized
error.handling.codes.DepartmentNameUnique=DEPARTMENT_NAME_UNIQUE
error.handling.codes.UserUsernameUnique=USER_USERNAME_UNIQUE
error.handling.codes.DeployRfcUnique=DEPLOY_RFC_UNIQUE
error.handling.codes.SoftwareCodeUnique=SOFTWARE_CODE_UNIQUE
error.handling.codes.SoftwareNameUnique=SOFTWARE_NAME_UNIQUE

# Packages: one sub folder per application (named after the application code) holding its packages, copied there
# outside Caipora. With several instances this must be shared storage.
caipora.packages.directory=${PACKAGES_DIRECTORY:${user.home}/caipora/packages}
caipora.packages.extensions=${PACKAGE_EXTENSIONS:zip,msi,exe,jar,war,ear,tar.gz,tgz,7z,nupkg}
# Forms no longer carry files
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Deploy scripts: the script of the application is saved to a temporary file and run as
# <interpreter...> <script file>, e.g. "bash" with ".sh", "powershell.exe,-NoProfile,-NonInteractive,-ExecutionPolicy,Bypass,-File"
# with ".ps1" or "cmd.exe,/c" with ".cmd".
caipora.deploy.interpreter=${DEPLOY_INTERPRETER:bash}
caipora.deploy.script-extension=${DEPLOY_SCRIPT_EXTENSION:.sh}
caipora.deploy.working-directory=${DEPLOY_WORKING_DIRECTORY:${java.io.tmpdir}}
caipora.deploy.timeout=${DEPLOY_TIMEOUT:PT30M}
caipora.deploy.max-output-chars=1000000
caipora.deploy.max-concurrent=4
# Name of this instance (defaults to the host name): a restart fails only the deploys this instance was running
caipora.node-id=${CAIPORA_NODE_ID:}

# Format & Globalization Settings
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH\:mm\:ss
spring.mvc.format.time=HH\:mm\:ss
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# Security
# Secret used to sign "remember me" cookies (>= 32 chars). If unset, a random key is generated at startup.
webForms.rememberMeKey=${REMEMBER_ME_KEY:}
webForms.rememberMeValidity=P14D
security.login.max-attempts=5
security.login.lock-duration=PT15M
# Initial password of the administrator, applied on the first run only (must be changed at the first sign-in)
caipora.admin.username=admin
caipora.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
# Use "native" or "framework" behind a reverse proxy so the real client address is used (login throttling)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Sessions: stored in the SPRING_SESSION tables, which are created by Flyway (V001)
spring.session.jdbc.initialize-schema=never

# Session cookie hardening (set COOKIE_SECURE=true when served over HTTPS)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Paging
spring.data.web.pageable.max-page-size=100
