<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Change password</title>
</head>
<body>
    <!--/*@thymesVar id="passwordChangeRequired" type="java.lang.Boolean"*/-->
    <div layout:fragment="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Change password</h1>
                <p class="page-subtitle">Choose a password with at least 8 characters that you don't use anywhere else.</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-7 col-xl-6">
                <div th:if="${passwordChangeRequired}" class="alert alert-warning mb-4" role="alert">
                    <i class="bi bi-shield-exclamation" aria-hidden="true"></i>
                    <span class="alert-text">Your current password is temporary. Please choose a new one to continue
                        using Caipora.</span>
                </div>

                <form th:action="@{/account/password}" th:object="${passwordChange}" method="post" hx-boost="false" novalidate>
                    <div class="card mb-4">
                        <div class="card-header"><i class="bi bi-key" aria-hidden="true"></i> Password</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="txtCurrentPassword" class="form-label required">Current password</label>
                                <div class="input-icon">
                                    <i class="bi bi-lock" aria-hidden="true"></i>
                                    <input type="password" id="txtCurrentPassword" name="currentPassword" value=""
                                           class="form-control has-action" autocomplete="current-password" maxlength="255"
                                           required autofocus th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" />
                                    <button type="button" class="btn btn-icon input-action" data-toggle-password="txtCurrentPassword"
                                            aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
                                </div>
                                <div th:replace="~{fragments/form-utils :: fieldErrors('passwordChange', 'currentPassword')}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="txtNewPassword" class="form-label required">New password</label>
                                <div class="input-icon">
                                    <i class="bi bi-shield-lock" aria-hidden="true"></i>
                                    <input type="password" id="txtNewPassword" name="newPassword" value=""
                                           class="form-control has-action" autocomplete="new-password" minlength="8" maxlength="255"
                                           required th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" />
                                    <button type="button" class="btn btn-icon input-action" data-toggle-password="txtNewPassword"
                                            aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
                                </div>
                                <div class="form-text">At least 8 characters. Longer passphrases are stronger.</div>
                                <div th:replace="~{fragments/form-utils :: fieldErrors('passwordChange', 'newPassword')}"></div>
                            </div>
                            <div>
                                <label for="txtConfirmPassword" class="form-label required">Confirm new password</label>
                                <input type="password" id="txtConfirmPassword" name="confirmPassword" value=""
                                       class="form-control" autocomplete="new-password" maxlength="255" required
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" />
                                <div th:replace="~{fragments/form-utils :: fieldErrors('passwordChange', 'confirmPassword')}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/}" class="btn btn-secondary" th:unless="${passwordChangeRequired}">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2" aria-hidden="true"></i> Change password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
