<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Stakeholders</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content" th:with="filtered=${stakeholderSearch.name != null or stakeholderSearch.email != null or stakeholderSearch.department != null or stakeholderSearch.gender != null}">
        <div class="page-header">
            <div>
                <h1 class="page-title">Stakeholders</h1>
                <p class="page-subtitle">People who own applications or authorize deployments.</p>
            </div>
            <div class="page-actions">
                <a class="btn btn-primary" th:href="@{/stakeholders/add}" sec:authorize="hasAuthority('ROLE_STAKEHOLDER_MANAGE')">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> New stakeholder
                </a>
            </div>
        </div>

        <div class="card">
            <form id="searchForm" class="filter-bar" th:action="${requestUri}" th:object="${stakeholderSearch}" method="get" role="search">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label for="txtName" class="form-label">Name</label>
                        <div class="input-icon">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="txtName" th:field="*{name}" class="form-control" placeholder="Search by name" />
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="cboDepartment" class="form-label">Department</label>
                        <select id="cboDepartment" th:field="*{department}" class="form-select">
                            <option value="">Any department</option>
                            <option th:each="optionValue : ${departmentValues}" th:value="${optionValue.key}" th:text="${optionValue.value}">Option</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="cboGender" class="form-label">Gender</label>
                        <select id="cboGender" th:field="*{gender}" class="form-select">
                            <option value="">Any</option>
                            <option th:each="optionValue : ${genderValues}" th:value="${optionValue}" th:text="${#strings.capitalize(#strings.toLowerCase(optionValue))}">Option</option>
                        </select>
                    </div>
                    <div class="col-md d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">Search</button>
                        <a th:href="${requestUri}" class="btn btn-secondary" th:if="${filtered}">Clear</a>
                    </div>
                </div>
            </form>

            <th:block th:if="${stakeholders.empty}">
                <div th:replace="~{fragments/form-utils :: emptyState('bi-person-badge', 'No stakeholders yet', ${filtered})}"></div>
            </th:block>

            <div th:unless="${stakeholders.empty}" class="table-responsive">
                <table class="table table-hover align-middle data-table">
                    <thead>
                    <tr>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('ID', ${sortByIdLink}, ${sortByIdDirection}, 'id')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Name', ${sortByNameLink}, ${sortByNameDirection}, 'name')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('E-mail', ${sortByEmailLink}, ${sortByEmailDirection}, 'email')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Gender', ${sortByGenderLink}, ${sortByGenderDirection}, 'gender')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Department', ${sortByDepartmentNameLink}, ${sortByDepartmentNameDirection}, 'department.name')}"></th>
                        <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="stakeholder : ${stakeholders}">
                        <td class="col-id">[[${stakeholder.id}]]</td>
                        <td><a th:href="@{/stakeholders/view/{id}(id=${stakeholder.id})}" class="row-title">[[${stakeholder.name}]]</a></td>
                        <td><a th:if="${stakeholder.email}" th:href="|mailto:${stakeholder.email}|">[[${stakeholder.email}]]</a><span th:unless="${stakeholder.email}" class="text-body-secondary">—</span></td>
                        <td th:text="${stakeholder.gender != null} ? ${#strings.capitalize(#strings.toLowerCase(stakeholder.gender))} : ''"></td>
                        <td>[[${stakeholder.departmentName}]]</td>
                        <td class="col-actions">
                            <div class="row-actions">
                                <a th:href="@{/stakeholders/view/{id}(id=${stakeholder.id})}" class="btn btn-icon"
                                   title="View" th:aria-label="|View ${stakeholder.name}|"><i class="bi bi-eye" aria-hidden="true"></i></a>
                                <a th:href="@{/stakeholders/edit/{id}(id=${stakeholder.id})}" class="btn btn-icon"
                                   sec:authorize="hasAuthority('ROLE_STAKEHOLDER_MANAGE')"
                                   title="Edit" th:aria-label="|Edit ${stakeholder.name}|"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                                <form th:action="@{/stakeholders/delete/{id}(id=${stakeholder.id})}" method="post"
                                      sec:authorize="hasAuthority('ROLE_STAKEHOLDER_MANAGE')" th:hx-confirm="#{delete.confirm}">
                                    <button type="submit" class="btn btn-icon btn-icon-danger" title="Delete"
                                            th:aria-label="|Delete ${stakeholder.name}|"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/form-utils :: pagination()}"></div>
        </div>
    </div>
</body>
</html>
