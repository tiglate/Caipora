<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Stakeholder Form</title>
</head>
<body>
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <!--/*@thymesVar id="stakeholder" type="br.dev.ampliar.caipora.model.StakeholderDTO"*/-->
    <!--/*@thymesVar id="departmentValues" type="java.util.Map"*/-->
    <!--/*@thymesVar id="genderValues" type="br.dev.ampliar.caipora.model.Gender[]"*/-->
    <th:block th:fragment="stakeholderForm(mode, stakeholder, departmentValues, genderValues)" th:object="${stakeholder}">
        <div class="card mb-4">
            <div class="card-header"><i class="bi bi-person-badge" aria-hidden="true"></i> Details</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="txtName" class="form-label required">Name</label>
                        <input type="text" id="txtName" class="form-control" maxlength="255" required autocomplete="off"
                               th:field="*{name}" th:disabled="${mode == 'view'}" th:autofocus="${mode != 'view'}"
                               th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('stakeholder', 'name')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="txtEmail" class="form-label">E-mail</label>
                        <input type="email" id="txtEmail" class="form-control" maxlength="255" autocomplete="off"
                               th:field="*{email}" th:disabled="${mode == 'view'}" th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('stakeholder', 'email')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cboDepartment" class="form-label required">Department</label>
                        <select id="cboDepartment" class="form-select" th:field="*{departmentId}" th:disabled="${mode == 'view'}"
                                th:errorclass="is-invalid">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${departmentValues}" th:value="${optionValue.key}">[[${optionValue.value}]]</option>
                        </select>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('stakeholder', 'departmentId')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cboGender" class="form-label required">Gender</label>
                        <select id="cboGender" class="form-select" th:field="*{gender}" th:disabled="${mode == 'view'}"
                                th:errorclass="is-invalid">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${genderValues}" th:value="${optionValue}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(optionValue))}">Gender</option>
                        </select>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('stakeholder', 'gender')}"></div>
                    </div>
                </div>
            </div>
        </div>

        <th:block th:if="${mode != 'add'}">
            <div th:replace="~{fragments/form-utils :: audit(${stakeholder.id}, ${stakeholder.createdAt}, ${stakeholder.updatedAt})}"></div>
        </th:block>
    </th:block>
</body>
</html>
