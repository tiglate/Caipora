<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Versions</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content" th:with="filtered=${versionSearch.softwareId != null or versionSearch.name != null}">
        <div class="page-header">
            <div>
                <h1 class="page-title">Versions</h1>
                <p class="page-subtitle">Released packages of each application, ready to be deployed.</p>
            </div>
            <div class="page-actions">
                <a class="btn btn-primary" th:href="@{/versions/add}" sec:authorize="hasAuthority('ROLE_VERSION_MANAGE')">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> New version
                </a>
            </div>
        </div>

        <div class="card">
            <form id="searchForm" class="filter-bar" th:action="${requestUri}" th:object="${versionSearch}" method="get" role="search">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label for="cboSoftware" class="form-label">Application</label>
                        <select id="cboSoftware" th:field="*{softwareId}" class="form-select">
                            <option value="">All applications</option>
                            <option th:each="optionValue : ${softwareValues}" th:value="${optionValue.key}" th:text="${optionValue.value}">Option</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="txtName" class="form-label">Version</label>
                        <div class="input-icon">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="txtName" th:field="*{name}" class="form-control" placeholder="e.g. 2.4" />
                        </div>
                    </div>
                    <div class="col-md d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">Search</button>
                        <a th:href="${requestUri}" class="btn btn-secondary" th:if="${filtered}">Clear</a>
                    </div>
                </div>
            </form>

            <th:block th:if="${versions.empty}">
                <div th:replace="~{fragments/form-utils :: emptyState('bi-tags', 'No versions yet', ${filtered})}"></div>
            </th:block>

            <div th:unless="${versions.empty}" class="table-responsive">
                <table class="table table-hover align-middle data-table">
                    <thead>
                    <tr>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('ID', ${sortByIdLink}, ${sortByIdDirection}, 'id')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Application', ${sortBySoftwareLink}, ${sortBySoftwareDirection}, 'software.name')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Version', ${sortByNameLink}, ${sortByNameDirection}, 'name')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Release date', ${sortByReleaseDateLink}, ${sortByReleaseDateDirection}, 'releaseDate')}"></th>
                        <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="version : ${versions}">
                        <td class="col-id">[[${version.id}]]</td>
                        <td>[[${version.softwareName}]]</td>
                        <td><a th:href="@{/versions/view/{id}(id=${version.id})}" class="row-title">[[${version.name}]]</a></td>
                        <td class="text-nowrap" th:text="${version.releaseDate != null} ? ${#temporals.format(version.releaseDate, 'dd MMM yyyy')} : ''"></td>
                        <td class="col-actions">
                            <div class="row-actions">
                                <a th:href="@{/versions/view/{id}(id=${version.id})}" class="btn btn-icon"
                                   title="View" th:aria-label="|View ${version.name}|"><i class="bi bi-eye" aria-hidden="true"></i></a>
                                <a th:href="@{/versions/edit/{id}(id=${version.id})}" class="btn btn-icon"
                                   sec:authorize="hasAuthority('ROLE_VERSION_MANAGE')"
                                   title="Edit" th:aria-label="|Edit ${version.name}|"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                                <form th:action="@{/versions/delete/{id}(id=${version.id})}" method="post"
                                      sec:authorize="hasAuthority('ROLE_VERSION_MANAGE')" th:hx-confirm="#{delete.confirm}">
                                    <button type="submit" class="btn btn-icon btn-icon-danger" title="Delete"
                                            th:aria-label="|Delete ${version.name}|"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/form-utils :: pagination()}"></div>
        </div>
    </div>
</body>
</html>
