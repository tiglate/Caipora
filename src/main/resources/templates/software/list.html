<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Applications</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content" th:with="filtered=${softwareSearch.code != null or softwareSearch.name != null or softwareSearch.ownerId != null}">
        <div class="page-header">
            <div>
                <h1 class="page-title">Applications</h1>
                <p class="page-subtitle">Software systems whose versions and deployments are tracked.</p>
            </div>
            <div class="page-actions">
                <a class="btn btn-primary" th:href="@{/softwares/add}" sec:authorize="hasAuthority('ROLE_APPLICATION_MANAGE')">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> New application
                </a>
            </div>
        </div>

        <div class="card">
            <form id="searchForm" class="filter-bar" th:action="${requestUri}" th:object="${softwareSearch}" method="get" role="search">
                <div class="row g-2 align-items-end">
                    <div class="col-md-2">
                        <label for="txtCode" class="form-label">Code</label>
                        <input type="search" id="txtCode" th:field="*{code}" class="form-control" placeholder="Code" />
                    </div>
                    <div class="col-md-4">
                        <label for="txtName" class="form-label">Name</label>
                        <div class="input-icon">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="txtName" th:field="*{name}" class="form-control" placeholder="Search by name" />
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="cboOwner" class="form-label">Owner</label>
                        <select id="cboOwner" th:field="*{ownerId}" class="form-select">
                            <option value="">Any owner</option>
                            <option th:each="optionValue : ${ownerValues}" th:value="${optionValue.key}" th:text="${optionValue.value}">Option</option>
                        </select>
                    </div>
                    <div class="col-md d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">Search</button>
                        <a th:href="${requestUri}" class="btn btn-secondary" th:if="${filtered}">Clear</a>
                    </div>
                </div>
            </form>

            <th:block th:if="${softwares.empty}">
                <div th:replace="~{fragments/form-utils :: emptyState('bi-boxes', 'No applications yet', ${filtered})}"></div>
            </th:block>

            <div th:unless="${softwares.empty}" class="table-responsive">
                <table class="table table-hover align-middle data-table">
                    <thead>
                    <tr>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('ID', ${sortByIdLink}, ${sortByIdDirection}, 'id')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Code', ${sortByCodeLink}, ${sortByCodeDirection}, 'code')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Name', ${sortByNameLink}, ${sortByNameDirection}, 'name')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Owner', ${sortByOwnerLink}, ${sortByOwnerDirection}, 'owner.name')}"></th>
                        <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="software : ${softwares}">
                        <td class="col-id">[[${software.id}]]</td>
                        <td><span class="code-pill">[[${software.code}]]</span></td>
                        <td><a th:href="@{/softwares/view/{id}(id=${software.id})}" class="row-title">[[${software.name}]]</a></td>
                        <td><th:block th:if="${software.ownerName}">[[${software.ownerName}]]</th:block><span th:unless="${software.ownerName}" class="text-body-secondary">—</span></td>
                        <td class="col-actions">
                            <div class="row-actions">
                                <a th:href="@{/softwares/view/{id}(id=${software.id})}" class="btn btn-icon"
                                   title="View" th:aria-label="|View ${software.name}|"><i class="bi bi-eye" aria-hidden="true"></i></a>
                                <a th:href="@{/softwares/edit/{id}(id=${software.id})}" class="btn btn-icon"
                                   sec:authorize="hasAuthority('ROLE_APPLICATION_MANAGE')"
                                   title="Edit" th:aria-label="|Edit ${software.name}|"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                                <form th:action="@{/softwares/delete/{id}(id=${software.id})}" method="post"
                                      sec:authorize="hasAuthority('ROLE_APPLICATION_MANAGE')" th:hx-confirm="#{delete.confirm}">
                                    <button type="submit" class="btn btn-icon btn-icon-danger" title="Delete"
                                            th:aria-label="|Delete ${software.name}|"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/form-utils :: pagination()}"></div>
        </div>
    </div>
</body>
</html>
