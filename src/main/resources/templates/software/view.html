<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Application</title>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: viewHeader(${software.name}, @{/softwares},
                @{/softwares/edit/{id}(id=${software.id})}, 'ROLE_APPLICATION_MANAGE')}"></div>
        <th:block th:replace="~{software/_form :: softwareForm('view', ${software}, ${ownerValues})}"></th:block>
    </div>
</body>
</html>
