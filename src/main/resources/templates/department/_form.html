<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Department Form</title>
</head>
<body>
    <!--/*@thymesVar id="department" type="br.dev.ampliar.caipora.model.DepartmentDTO"*/-->
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <th:block th:fragment="departmentForm(mode, department)" th:object="${department}">
        <div class="card mb-4">
            <div class="card-header"><i class="bi bi-diagram-3" aria-hidden="true"></i> Details</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="txtName" class="form-label required">Name</label>
                        <input type="text" id="txtName" class="form-control" maxlength="255" required
                               th:field="*{name}" th:disabled="${mode == 'view'}"
                               th:autofocus="${mode != 'view'}"
                               th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('department', 'name')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="txtEmail" class="form-label">E-mail</label>
                        <input type="email" id="txtEmail" class="form-control" maxlength="255" autocomplete="off"
                               th:field="*{email}" th:disabled="${mode == 'view'}" th:errorclass="is-invalid" />
                        <div class="form-text" th:if="${mode != 'view'}">Shared mailbox of the department, if any.</div>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('department', 'email')}"></div>
                    </div>
                </div>
            </div>
        </div>

        <th:block th:if="${mode != 'add'}">
            <div th:replace="~{fragments/form-utils :: audit(${department.id}, ${department.createdAt}, ${department.updatedAt})}"></div>
        </th:block>
    </th:block>
</body>
</html>
