<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Departments</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content"
         th:with="filtered=${departmentSearch.name != null or departmentSearch.email != null}">
        <div class="page-header">
            <div>
                <h1 class="page-title">Departments</h1>
                <p class="page-subtitle">Organizational units that users and stakeholders belong to.</p>
            </div>
            <div class="page-actions">
                <a class="btn btn-primary" th:href="@{/departments/add}"
                   sec:authorize="hasAuthority('ROLE_DEPARTMENT_MANAGE')">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> New department
                </a>
            </div>
        </div>

        <div class="card">
            <form id="searchForm" class="filter-bar" th:action="${requestUri}" th:object="${departmentSearch}" method="get" role="search">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label for="txtName" class="form-label">Name</label>
                        <div class="input-icon">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="txtName" th:field="*{name}" class="form-control" placeholder="Search by name" />
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="txtEmail" class="form-label">E-mail</label>
                        <input type="search" id="txtEmail" th:field="*{email}" class="form-control" placeholder="Search by e-mail" />
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">Search</button>
                        <a th:href="${requestUri}" class="btn btn-secondary" th:if="${filtered}">Clear</a>
                    </div>
                </div>
            </form>

            <th:block th:if="${departments.empty}">
                <div th:replace="~{fragments/form-utils :: emptyState('bi-diagram-3', 'No departments yet', ${filtered})}"></div>
            </th:block>

            <div th:unless="${departments.empty}" class="table-responsive">
                <table class="table table-hover align-middle data-table">
                    <thead>
                    <tr>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('ID', ${sortByIdLink}, ${sortByIdDirection}, 'id')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('Name', ${sortByNameLink}, ${sortByNameDirection}, 'name')}"></th>
                        <th th:replace="~{fragments/table-utils :: sortableColumnHeader('E-mail', ${sortByEmailLink}, ${sortByEmailDirection}, 'email')}"></th>
                        <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="department : ${departments}">
                        <td class="col-id">[[${department.id}]]</td>
                        <td><a th:href="@{/departments/view/{id}(id=${department.id})}" class="row-title">[[${department.name}]]</a></td>
                        <td>
                            <a th:if="${department.email}" th:href="|mailto:${department.email}|">[[${department.email}]]</a>
                            <span th:unless="${department.email}" class="text-body-secondary">—</span>
                        </td>
                        <td class="col-actions">
                            <div class="row-actions">
                                <a th:href="@{/departments/view/{id}(id=${department.id})}" class="btn btn-icon"
                                   title="View" th:aria-label="|View ${department.name}|"><i class="bi bi-eye" aria-hidden="true"></i></a>
                                <a th:href="@{/departments/edit/{id}(id=${department.id})}" class="btn btn-icon"
                                   sec:authorize="hasAuthority('ROLE_DEPARTMENT_MANAGE')"
                                   title="Edit" th:aria-label="|Edit ${department.name}|"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                                <form th:action="@{/departments/delete/{id}(id=${department.id})}" method="post"
                                      sec:authorize="hasAuthority('ROLE_DEPARTMENT_MANAGE')" th:hx-confirm="#{delete.confirm}">
                                    <button type="submit" class="btn btn-icon btn-icon-danger" title="Delete"
                                            th:aria-label="|Delete ${department.name}|"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/form-utils :: pagination()}"></div>
        </div>
    </div>
</body>
</html>
