<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Department</title>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: viewHeader(${department.name}, @{/departments},
                @{/departments/edit/{id}(id=${department.id})}, 'ROLE_DEPARTMENT_MANAGE')}"></div>
        <th:block th:replace="~{department/_form :: departmentForm('view', ${department})}"></th:block>
    </div>
</body>
</html>
