<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>User Form</title>
</head>
<body>
    <!--/*@thymesVar id="mode" type="java.lang.String"*/-->
    <!--/*@thymesVar id="user" type="br.dev.ampliar.caipora.model.UserDTO"*/-->
    <!--/*@thymesVar id="genderValues" type="br.dev.ampliar.caipora.model.Gender[]"*/-->
    <!--/*@thymesVar id="departmentValues" type="java.util.Map"*/-->
    <!--/*@thymesVar id="rolesValues" type="java.util.Map"*/-->
    <!--/*@thymesVar id="currentUserId" type="java.lang.Integer"*/-->
    <!--/*@thymesVar id="grantableRoles" type="java.util.Set"*/-->
    <th:block th:fragment="userForm(mode, user, genderValues, departmentValues, rolesValues)" th:object="${user}">
        <div class="card mb-4">
            <div class="card-header"><i class="bi bi-person" aria-hidden="true"></i> Profile</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="txtName" class="form-label required">Full name</label>
                        <input type="text" id="txtName" class="form-control" maxlength="255" required autocomplete="off"
                               th:field="*{name}" th:disabled="${mode == 'view'}" th:autofocus="${mode != 'view'}"
                               th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'name')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="txtEmail" class="form-label">E-mail</label>
                        <input type="email" id="txtEmail" class="form-control" maxlength="255" autocomplete="off"
                               th:field="*{email}" th:disabled="${mode == 'view'}" th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'email')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cboDepartment" class="form-label required">Department</label>
                        <select id="cboDepartment" class="form-select" th:field="*{departmentId}" th:disabled="${mode == 'view'}"
                                th:errorclass="is-invalid">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${departmentValues}" th:value="${optionValue.key}">[[${optionValue.value}]]</option>
                        </select>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'departmentId')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cboGender" class="form-label required">Gender</label>
                        <select id="cboGender" class="form-select" th:field="*{gender}" th:disabled="${mode == 'view'}"
                                th:errorclass="is-invalid">
                            <option value="">Please select</option>
                            <option th:each="optionValue : ${genderValues}" th:value="${optionValue}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(optionValue))}">Gender</option>
                        </select>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'gender')}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header"><i class="bi bi-key" aria-hidden="true"></i> Account</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="txtUsername" class="form-label required">Username</label>
                        <input type="text" id="txtUsername" class="form-control" maxlength="50" required
                               autocomplete="off" autocapitalize="none" spellcheck="false"
                               th:field="*{username}" th:disabled="${mode == 'view'}" th:errorclass="is-invalid" />
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'username')}"></div>
                    </div>
                    <div class="col-md-6" th:if="${mode != 'view'}">
                        <label for="txtPassword" class="form-label" th:classappend="${mode == 'add'} ? 'required'"
                               th:text="${mode == 'add'} ? 'Password' : 'New password'">Password</label>
                        <div class="input-icon">
                            <i class="bi bi-lock" aria-hidden="true"></i>
                            <input type="password" id="txtPassword" name="password" class="form-control has-action"
                                   minlength="8" maxlength="255" autocomplete="new-password" value=""
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" />
                            <button type="button" class="btn btn-icon input-action" data-toggle-password="txtPassword"
                                    aria-label="Show password" aria-pressed="false">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="form-text" th:text="${mode == 'add'} ? 'At least 8 characters.' : 'Leave blank to keep the current password.'"></div>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'password')}"></div>
                    </div>
                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input type="checkbox" id="chkEnabled" class="form-check-input" role="switch"
                                   th:field="*{enabled}" th:errorclass="is-invalid"
                                   th:disabled="${mode == 'view' or (mode == 'edit' and user.id == currentUserId)}" />
                            <label for="chkEnabled" class="form-check-label">Account enabled</label>
                        </div>
                        <!--/* a disabled checkbox is not submitted: keep the account enabled when editing one's own */-->
                        <input type="hidden" name="enabled" value="true" th:if="${mode == 'edit' and user.id == currentUserId}" />
                        <div class="form-text">
                            <th:block th:if="${mode == 'edit' and user.id == currentUserId}">You cannot disable your own account.</th:block>
                            <th:block th:unless="${mode == 'edit' and user.id == currentUserId}">Disabled accounts cannot sign in.</th:block>
                        </div>
                        <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'enabled')}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-shield-lock" aria-hidden="true"></i> Permissions
                <span class="card-header-hint" th:if="${mode != 'view'}"
                      th:text="${mode == 'edit' and user.id == currentUserId} ? 'You cannot change your own permissions'
                               : 'You can grant only the permissions you hold'">Select the roles</span>
            </div>
            <div class="card-body">
                <div class="role-grid" role="group" aria-label="Roles">
                    <label class="role-option" th:each="role : ${rolesValues}"
                           th:with="roleName=${#strings.substringAfter(role.value, 'ROLE_')},
                                    area=${roleName.substring(0, roleName.lastIndexOf('_'))},
                                    level=${roleName.substring(roleName.lastIndexOf('_') + 1)}">
                        <input type="checkbox" class="form-check-input" th:field="*{roles}" th:value="${role.key}"
                               th:disabled="${mode == 'view' or (mode == 'edit' and user.id == currentUserId)
                                              or !#sets.contains(grantableRoles, role.key)}" />
                        <span>
                            <span class="fw-medium" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(area, '_', ' ')))}">Area</span>
                            <small th:text="${level == 'MANAGE'} ? 'Create, edit and delete' : (${level == 'VIEW'} ? 'Read only' : 'Access')">Level</small>
                        </span>
                    </label>
                </div>
                <div th:replace="~{fragments/form-utils :: fieldErrors('user', 'roles')}"></div>
            </div>
        </div>

        <th:block th:if="${mode != 'add'}">
            <div th:replace="~{fragments/form-utils :: audit(${user.id}, ${user.createdAt}, ${user.updatedAt})}"></div>
        </th:block>
    </th:block>
</body>
</html>
