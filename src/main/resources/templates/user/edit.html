<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>Edit user</title>
</head>
<body>
    <!--/*@thymesVar id="requestUri" type="java.lang.String"*/-->
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: header('edit', 'Edit user', 'userForm', @{/users})}"></div>
        <div th:replace="~{fragments/form-utils :: globalErrors('user')}"></div>
        <form th:action="${requestUri}" method="post" id="userForm" hx-boost="false" novalidate>
            <th:block th:replace="~{user/_form :: userForm('edit', ${user}, ${genderValues}, ${departmentValues}, ${rolesValues})}"></th:block>
            <div class="form-actions">
                <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2" aria-hidden="true"></i> Save</button>
            </div>
        </form>
    </div>
</body>
</html>
