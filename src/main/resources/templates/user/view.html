<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en"
      layout:decorate="~{layout}">
<head>
    <title>User</title>
</head>
<body>
    <div layout:fragment="content">
        <div th:replace="~{fragments/header :: viewHeader(${user.name}, @{/users},
                ${canManage} ? @{/users/edit/{id}(id=${user.id})} : null, 'ROLE_USER_MANAGE')}"></div>
        <th:block th:replace="~{user/_form :: userForm('view', ${user}, ${genderValues}, ${departmentValues}, ${rolesValues})}"></th:block>
    </div>
</body>
</html>
